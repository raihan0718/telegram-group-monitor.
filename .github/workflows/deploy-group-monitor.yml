name: Deploy Group Monitor

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/group-monitor/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-group-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing GitHub secret SUPABASE_PROJECT_ID" && exit 1)
      - name: Deploy group-monitor
        run: supabase functions deploy group-monitor --project-ref "$SUPABASE_PROJECT_ID" --yes
